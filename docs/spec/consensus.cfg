\* Bounded model config (BUG-S0-026): small constants so the full
\* safety property set is TLC-checkable. See README.md for rationale.

CONSTANT
    ChainId = 1
    AddrSet = {1, 2}
    MaxBlocks = 3
    MaxAmount = 3
    MaxNonce = 2
    InitialBalance = 5
    InitialReward = 4
    HalvingInterval = 2
    TailRateNum = 1
    TailRateDen = 1
    BlocksPerYear = 2
    MaxTime = 2
    MaxHash = 1
    MaxTarget = 1

\* Use SPECIFICATION (not INIT/NEXT): with INIT/NEXT TLC silently ignores
\* the fairness conjuncts in Spec, producing spurious liveness counterexamples.

SPECIFICATION Spec

INVARIANT
    TypeInvariant
    SupplyConsistency
    NoDoubleSpend
    NoInflation
    AllTxSigned
    NonceMonotonic
    ChainContinuity
    PowValidity
    ChainIdConsistency

PROPERTY
    Liveness
