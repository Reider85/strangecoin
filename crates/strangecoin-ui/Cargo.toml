[package]
name = "strangecoin-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.30.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "=0.30.0"
fluent = "0.16.0"
fluent-bundle = "0.15.0"
fluent-langneg = "0.13.0"
unic-langid = { version = "0.9.0", features = ["macros"] }
strangecoin-core = { path = "../strangecoin-core" }
secp256k1 = { version = "0.29.0", features = ["rand-std"] }
blake3 = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync"] }
tracing = "0.1"
hex = "0.4"
regex = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.39", features = ["json"] }
tempfile = "3.8"

[features]
# `a11y-audit` gates the axe-core WCAG AA suite (tests/a11y_audit.rs) and is
# default-on so `cargo test -p strangecoin-ui` covers it in every run (UI-P02 КГ).
default = ["eframe_egui", "a11y-audit"]
eframe_egui = []
a11y-audit = []



[lib]
name = "strangecoin_ui"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
panic = "abort"