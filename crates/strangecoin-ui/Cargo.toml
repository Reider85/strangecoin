[package]
name = "strangecoin-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "=0.30.0"
egui = "=0.30.0"
fluent = "=0.16.1"
unic-langid = { version = "=0.9.6", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=1.1.8"
tracing = "0.1"
hex = "0.4"
regex = "1"

[dev-dependencies]
insta = { version = "=1.49.0", features = ["json"] }

[features]
# `a11y-audit` gates the axe-core WCAG AA suite (tests/a11y_audit.rs) and is
# default-on so `cargo test -p strangecoin-ui` covers it in every run (UI-P02 КГ).
default = ["eframe_egui", "a11y-audit"]
eframe_egui = []
a11y-audit = []
a11y-axe = []



[lib]
name = "strangecoin_ui"
path = "src/lib.rs"

# UI-P03: screen-level a11y gate lives in tests/screens/ (not auto-discovered
# by Cargo, which only scans tests/*.rs).
[[test]]
name = "wallet_a11y"
path = "tests/screens/wallet_a11y.rs"

# UI-P04: screen-level WCAG AA gates for the two new screens.
[[test]]
name = "dashboard_a11y"
path = "tests/screens/dashboard_a11y.rs"

[[test]]
name = "tx_detail_a11y"
path = "tests/screens/tx_detail_a11y.rs"
