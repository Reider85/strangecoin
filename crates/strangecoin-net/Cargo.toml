[package]
name = "strangecoin-net"
version = "0.1.0"
edition = "2021"
description = "Strangecoin network crate: P2P protocol, Noise transport, gossip, compact blocks, Erlay, peer management (Stage 2)"

[dependencies]
# See docs/ADR/0020-noise-protocol-framework.md (Noise), 0021-erlay-integration.md (Erlay), 0022-peer-scoring-algorithm.md (scoring), 0023-rate-limiting-strategy.md (rate limit)
strangecoin-core = { path = "../strangecoin-core", version = "1.5.0" }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
blake3 = "1"
hex = "0.4"
# Noise Protocol Framework (ADR-0020), S2-P07. Pinned exact per Stage 2 Pin
# Policy: the snow API breaks between majors (0.9 -> 0.10); bumps go through
# SCIP after mainnet freeze only.
snow = "=0.10.0"
# Ed25519 internal P2P identity (node_id auth, ADR-0020), S2-P09. Pinned per
# Stage 2 Pin Policy (AGENTS.md): 2.x broke API vs 1.x; bumps via SCIP only.
ed25519-dalek = "=2.0"
# HKDF-SHA256 for the deterministic Noise ephemeral-key derivation
# (Stage 2 determinism checklist item 3, S2-P09); sha2 supplies Sha256 for it.
# Both pinned: they sit on the handshake key-derivation path.
hkdf = "=0.12.1"
sha2 = "=0.10.9"
# Error enum convention matches strangecoin-core / strangecoin-vm-wasm.
thiserror = "1"
