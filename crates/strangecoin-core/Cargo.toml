[package]
name = "strangecoin-core"
version = "1.0.0"
edition = "2021"
description = "Pure core of Strangecoin: serialization, types, consensus rules, economics — 0 I/O"

[dependencies]
blake3 = "1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1"
secp256k1 = { version = "0.29", features = ["recovery"] }
sha2 = "0.10"
base64 = "0.22.1"

[dev-dependencies]
proptest = "1"
rand = "0.8"
