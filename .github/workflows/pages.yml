name: GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: "latest"
      
      - name: Build mdBook
        run: |
          # Create a custom book.toml for GitHub Pages
          cp analytics/ARCHITECT3.md docs/index.md
          cp README.md docs/README.md
          
          # Create book.toml
          cat > docs/book.toml << EOF
          [book]
          title = "Strangecoin Documentation"
          description = "Production-grade Layer-1 blockchain in Rust for AI agents"
          authors = ["Reider85"]
          language = "en"
          
          [build]
          build-dir = "docs/book"
          
          [output.html]
          site-url = "/strangecoin/"
          edit-url = "https://github.com/Reider85/strangecoin/edit/master/docs/"
          
          [output.html.fold]
          enable = true
          
          [output.html.playground]
          editable = true
          
          [output.html.search]
          enable = true
          limit-results = 20
          
          [output.html.redirect]
          "/analytics/" = "/strangecoin/analytics/"
          EOF
          
          # Build the documentation
          cd docs
          mdbook build
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4