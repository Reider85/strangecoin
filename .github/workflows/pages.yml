name: GitHub Pages

# [GITHUB-P06] Hybrid runners: both jobs read the repo variable RUNS_ON
# (JSON label array). Unset -> ubuntu-latest as before; set -> the local
# self-hosted Windows runner. The build step's heredoc needs an explicit
# `shell: bash` (pwsh on the local runner cannot run `cat > ... << EOF`),
# and the build job carries the same fork-PR guard as ci.yml — while
# RUNS_ON is set, fork PRs never execute on the dev machine.
# See .github/SELF_HOSTED_RUNNERS.md.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # [GITHUB-P06] unset -> ubuntu-latest; set -> self-hosted labels.
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    # [GITHUB-P06] fork-PR guard (see header): local execution only for
    # pushes and same-repo PRs while RUNS_ON is set.
    if: ${{ !vars.RUNS_ON || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: "latest"
      
      # [GITHUB-P06] shell: bash — the heredoc below is bash syntax; the
      # local Windows runner's default shell is pwsh.
      - name: Build mdBook
        shell: bash
        run: |
          # Create a custom book.toml for GitHub Pages
          cp analytics/ARCHITECT3.md docs/index.md
          cp README.md docs/README.md
          
          # Create book.toml
          cat > docs/book.toml << EOF
          [book]
          title = "Strangecoin Documentation"
          description = "Production-grade Layer-1 blockchain in Rust for AI agents"
          authors = ["Reider85"]
          language = "en"
          
          [build]
          build-dir = "docs/book"
          
          [output.html]
          site-url = "/strangecoin/"
          edit-url = "https://github.com/Reider85/strangecoin/edit/master/docs/"
          
          [output.html.fold]
          enable = true
          
          [output.html.playground]
          editable = true
          
          [output.html.search]
          enable = true
          limit-results = 20
          
          [output.html.redirect]
          "/analytics/" = "/strangecoin/analytics/"
          EOF
          
          # Build the documentation
          cd docs
          mdbook build
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # [GITHUB-P06] unset -> ubuntu-latest; set -> self-hosted labels
    # (actions/deploy-pages is a node action, runner-portable).
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4