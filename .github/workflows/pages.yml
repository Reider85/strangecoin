name: GitHub Pages

# [GITHUB-P06] Hybrid runners: both jobs read the repo variable RUNS_ON
# (JSON label array). Unset -> ubuntu-latest as before; set -> the local
# self-hosted Windows runner. The build step's heredoc needs an explicit
# `shell: bash` (pwsh on the local runner cannot run `cat > ... << EOF`),
# and the build job carries a fork-PR guard as ci.yml does.
# See .github/SELF_HOSTED_RUNNERS.md.
#
# [GITHUB-P09] Pages trigger hardening:
#   - pull_request trigger removed — Dependabot PRs (e.g. actions/checkout
#     bumps) produced phantom Pages-runs; the job-level guard below stays
#     as belt-and-suspenders if the trigger is ever re-added.
#   - push is paths-filtered to specific source files: README.md,
#     analytics/ARCHITECT.md, docs sources, and pages.yml itself; ADR-only
#     changes (analytics/ADR/) must NOT trigger Pages.
#   - workflow_dispatch kept for manual runs (CI2 prompt 4, check #2).

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/src/**'      # mdbook source root
      - 'docs/book.toml'   # mdbook config
      - 'README.md'        # copied into docs/src/README.md
      - 'analytics/ARCHITECT.md'  # copied into docs/src/index.md
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # [GITHUB-P06] unset -> ubuntu-latest; set -> self-hosted labels.
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    # [GITHUB-P06] fork-PR guard (see header): local execution only for
    # pushes and same-repo PRs while RUNS_ON is set.
    # [GITHUB-P09] `!= 'pull_request'` replaces `== 'push'`: pull_request
    # trigger was removed (see on:), so this now lets push AND
    # workflow_dispatch run even while RUNS_ON is set.
    if: ${{ !vars.RUNS_ON || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # [GITHUB-P06] local runner pins gnu-flavor (matches dev
        # machine rustup default; msvc flavor would need MSVC).
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUNS_ON && 'stable-x86_64-pc-windows-gnu' || 'stable' }}

      - name: Cargo cache (mdbook)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-mdbook

      - name: Install mdBook
        # [GITHUB-P18] peaceiris/actions-mdbook@v2.0.0 was Node 16,
        # deprecated by GitHub (Oct 2024). GitHub has been force-running
        # node16 actions on node20 (setup steps still passed), but the
        # dependency is unmaintained (last release Sep 2024). Switch to
        # cargo install: no third-party action, no node-versions,
        # runner-portable (works on ubuntu-latest and on the RUNS_ON
        # self-hosted Windows runner with Rust toolchain installed).
        # [GITHUB-P06] shell: bash — the local Windows runner's
        # default pwsh treats `&&` differently; explicit bash.
        shell: bash
        run: |
          # Pin mdbook to 0.4.52 (reproducible build; bump deliberately).
          cargo install mdbook --version 0.4.52 --locked
      
      # [GITHUB-P06] shell: bash — the heredoc below is bash syntax; the
      # local Windows runner's default shell is pwsh.
      # [GITHUB-P09] mdbook needs src/ + SUMMARY.md under the book root:
      # index copies now land in docs/src/, book.toml gets explicit src="src"
      # and build-dir="book" (resolves to docs/book == upload path below;
      # the old build-dir="docs/book" would have resolved to docs/docs/book).
      - name: Build mdBook
        shell: bash
        run: |
          # Stage content into docs/src (mdbook source root)
          mkdir -p docs/src
          cp analytics/ARCHITECT.md docs/src/index.md
          cp README.md docs/src/README.md
          cat > docs/src/SUMMARY.md << EOF
          # Summary
          - [Introduction](index.md)
          - [README](README.md)
          EOF

          # Create book.toml
          # [GITHUB-P18] removed the former [output.html.redirect]
          # "/analytics/" = "/strangecoin/analytics/" block: mdbook
          # File::create on a trailing-slash path fails on both OSes
          # (Windows os error 267, Linux EISDIR), the source and target
          # URLs were identical (self-loop), and the target chapter does
          # not exist in this 2-page book. It never ran on CI (the
          # cp analytics/ARCHITECT3.md step always failed first).
          cat > docs/book.toml << EOF
          [book]
          title = "Strangecoin Documentation"
          description = "Production-grade Layer-1 blockchain in Rust for AI agents"
          authors = ["Reider85"]
          language = "en"
          src = "src"
          
          [build]
          build-dir = "book"
          
          [output.html]
          site-url = "/strangecoin/"
          edit-url = "https://github.com/Reider85/strangecoin/edit/master/docs/"
          
          [output.html.fold]
          enable = true
          
          [output.html.playground]
          editable = true
          
          [output.html.search]
          enable = true
          limit-results = 20
          EOF
          
          # Build the documentation
          cd docs
          mdbook build
          
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # [GITHUB-P06] unset -> ubuntu-latest; set -> self-hosted labels
    # (actions/deploy-pages is a node action, runner-portable).
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5