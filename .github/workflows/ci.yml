name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  source-gates:
    name: Source gates (rg audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BUG-S0-022 / S1-P12: executable form of the balances-mutation audit.
      # Mirrors tests/balances_gate.rs (which runs on every platform via
      # `cargo test --workspace`); this step fails fast without a Rust build.
      - name: "Gate: no direct balances mutations (BUG-S0-022)"
        run: |
          set -euo pipefail
          raw=$(rg -n '\.balances\.(insert|remove|get_mut)' src/ \
            --glob '!state_cache.rs' --glob '!block_executor.rs' || true)
          assign=$(rg -n '\.balances\s*=[^=]' src/ \
            --glob '!state_cache.rs' --glob '!chain_selector.rs' || true)
          if [ -n "$raw$assign" ]; then
            echo "Direct balances mutation outside whitelisted files (BUG-S0-022 / S1-P12):"
            printf '%s\n' "$raw" "$assign"
            exit 1
          fi
          echo "OK: 0 direct balances mutations outside state_cache/block_executor/chain_selector"

      # BUG-S1-012 / P21: #[allow(dead_code)] and #[allow(clippy::await_holding_lock)]
      # are permitted only with a // justification comment on the preceding line.
      - name: "Gate: allow(dead_code)/await_holding_lock must be justified (BUG-S1-012)"
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            prev=$(sed -n "$((line - 1))p" "$file" | sed 's/^[[:space:]]*//')
            case "$prev" in
              //*) ;;
              *)
                echo "Unjustified allow at $hit"
                violations=1
                ;;
            esac
          done < <(rg -n '#\[allow\((dead_code|clippy::await_holding_lock)\)\]' src/ tests/ crates/ --glob '*.rs' || true)
          if [ "$violations" -ne 0 ]; then
            echo "Each #[allow(dead_code)] / #[allow(clippy::await_holding_lock)] needs a // justification comment on the previous line (P21 / BUG-S1-012)"
            exit 1
          fi
          echo "OK: all dead_code / await_holding_lock allows carry a justification comment"

      # BUG-S1-014: the three Stage 0 summary docs must agree with their own
      # detail tables and with each other (invariants 17/5/0 of 22; critical
      # issues 12/3/0). Fails fast without a Rust build.
      - name: "Gate: Stage 0 summary arithmetic (BUG-S1-014)"
        run: python3 scripts/audit/check_stage0_arith.py

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build release
        run: cargo build --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --all --out Html --output-dir coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/tarpaulin-report.html
          retention-days: 30

  fuzz:
    name: Fuzz ${{ matrix.target }} (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # S1.5-P16: canonical decode (S1-P19) + four Stage 1.5 VM targets.
        target:
          - canonical_decode
          - host_functions
          - gas_metering
          - storage_trie
          - differential_wasmi_vs_wasmtime
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      # BUG-S0-023 / S1.5-P07 / S1.5-P16: coverage-guided 10-minute run per
      # target. A crash fails the job; repro artifacts are uploaded below.
      - name: Run ${{ matrix.target }} fuzz (600s)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=2560

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
