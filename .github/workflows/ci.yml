name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  source-gates:
    name: Source gates (rg audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BUG-S0-022 / S1-P12: executable form of the balances-mutation audit.
      # Mirrors tests/balances_gate.rs (which runs on every platform via
      # `cargo test --workspace`); this step fails fast without a Rust build.
      - name: "Gate: no direct balances mutations (BUG-S0-022)"
        run: |
          set -euo pipefail
          raw=$(rg -n '\.balances\.(insert|remove|get_mut)' src/ \
            --glob '!state_cache.rs' --glob '!block_executor.rs' || true)
          assign=$(rg -n '\.balances\s*=[^=]' src/ \
            --glob '!state_cache.rs' --glob '!chain_selector.rs' || true)
          if [ -n "$raw$assign" ]; then
            echo "Direct balances mutation outside whitelisted files (BUG-S0-022 / S1-P12):"
            printf '%s\n' "$raw" "$assign"
            exit 1
          fi
          echo "OK: 0 direct balances mutations outside state_cache/block_executor/chain_selector"

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build release
        run: cargo build --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --all --out Html --output-dir coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/tarpaulin-report.html
          retention-days: 30

  fuzz-canonical-decode:
    name: Fuzz canonical_decode (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      # BUG-S0-023 / S1.5-P07: coverage-guided 10-minute run — the S1-P19
      # checklist item that could not execute on the Windows dev host
      # (no MSVC/ASan, see fuzz/README.md). A crash fails the job;
      # repro artifacts are uploaded below.
      - name: Run canonical_decode fuzz (600s)
        run: cargo fuzz run canonical_decode -- -max_total_time=600 -rss_limit_mb=2560

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-canonical-decode-artifacts
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
