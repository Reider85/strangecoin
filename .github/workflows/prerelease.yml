name: Pre-release

# [GITHUB-P12] prerelease: full rewrite — 7 bugfixes (conclusion gate, head_sha
# checkout, rust-toolchain, rust-cache, github-script steps undefined,
# context.tag undefined, stargazer push-loop removed).
#
# Triggers only on GREEN CI for master. Tags vX.Y.Z-dev.N on the exact CI
# commit (workflow_run.head_sha) — no race with later pushes. Linux x86_64
# binary only; full 6-platform matrix is release.yml on v*-tags.
#
# Stargazer-history snapshot moved out to .github/workflows/stargazer.yml
# (hourly cron, no commit-back to master) — was creating a recursive loop:
# push → CI → prerelease → stargazer-push to master → CI → prerelease → ...

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: prerelease-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  create-dev-tag:
    name: Create dev tag (vX.Y.Z-dev.N)
    runs-on: ubuntu-latest
    # Bug 1 fix: skip prerelease when CI did not succeed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30

    steps:
      - name: Checkout CI head commit
        uses: actions/checkout@v7
        with:
          # Bug 2 fix: pin to the SHA that ran CI, not current master HEAD.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: prerelease-linux-x86_64

      - name: Compute next dev tag
        id: compute-tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
          # [GITHUB-P22] cut -f2 FIRST: `git ls-remote` lines are
          # "<sha>\trefs/tags/<tag>". Sorting the RAW line with `sort -V`
          # version-sorts the sha prefix too, and hex digit-runs compare
          # numerically — dev.1's sha (117...) sorts AFTER dev.2's sha
          # (89...), so `tail -1` returned dev.1, NEXT computed dev.2,
          # "release already exists" skipped every run (silent dev-tag
          # stall at dev.2 — runs #54..#57 were 30s no-ops). Extract the
          # tag name first, then sort tag names only.
          LATEST_DEV_TAG=$(git ls-remote --tags origin "v${VERSION}-dev.*" \
            | cut -f2 | sed 's#refs/tags/##' | sed 's#\^{}##' \
            | sort -V | tail -1 || true)
          if [[ -n "$LATEST_DEV_TAG" ]]; then
            CURRENT_NUM=$(echo "$LATEST_DEV_TAG" | grep -oE '[0-9]+$')
            NEXT_NUM=$((CURRENT_NUM + 1))
          else
            NEXT_NUM=1
          fi
          TAG="v${VERSION}-dev.${NEXT_NUM}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Will create tag: $TAG"

      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.compute-tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping creation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary (Linux x86_64)
        if: steps.check-release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          cp target/release/strangecoin strangecoin-linux-x86_64
          shasum -a 256 strangecoin-linux-x86_64 > strangecoin-linux-x86_64.sha256

      # [GITHUB-P28] root cause of Pre-release #60 (run 44383029624, 18 Nov
      # 19:52:23Z): `gh release create` failed with HTTP 403 "Resource not
      # accessible by integration" on POST /releases 0.7s after step start.
      # Build (9.5 min) and commit-comment both succeeded — Hypotheses A (OOM)
      # and C (comment rate-limit) refuted; Hypothesis B confirmed (error class
      # 403, not 5xx). Identical workflow + permissions succeeded 30 min later
      # in run #61 => transient GitHub-side auth failure (exact trigger unknown:
      # no githubstatus incident at 19:52 UTC 18 Nov). Fix: 3x retry with
      # backoff on the network-bound gh call only (cargo build stays deterministic).
      - name: Create and push dev release
        if: steps.check-release.outputs.skip != 'true'
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # [GITHUB-P28] NOT set -e — the retry loop must survive the first
          # failure; only the final verdict (exit 0/1) decides the step.
          set -uo pipefail
          TAG="${{ steps.compute-tag.outputs.tag }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          FILES=(strangecoin-linux-x86_64 strangecoin-linux-x86_64.sha256)
          for attempt in 1 2 3; do
            # [GITHUB-P28] D1 (deviation from literal CI5 snippet): a partial
            # prior attempt (release created, asset upload failed) would make
            # `gh release create` retry fail with 422 already_exists — detect
            # the existing release and upload assets with --clobber instead.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists (partial prior attempt?) — uploading assets."
              if gh release upload "$TAG" "${FILES[@]}" --clobber; then
                echo "Assets uploaded on attempt $attempt."
                exit 0
              fi
            elif gh release create "$TAG" \
              --target "$HEAD_SHA" \
              --prerelease \
              --title "$TAG" \
              --notes "Automated dev build, not for production" \
              --generate-notes \
              "${FILES[@]}"; then
              echo "Release created on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed. Sleeping $((attempt * 30))s before retry..."
            sleep $((attempt * 30))
          done
          echo "All 3 attempts failed."
          exit 1

      # [GITHUB-P28] Hypothesis C hardening: commit-comment is best-effort —
      # retry 3x on transient API failures (rate-limit/5xx), then warn instead
      # of failing the job (the release itself already succeeded at this point).
      # D2 (deviation from literal CI5 snippet): message depends on the create
      # step outcome — #60 posted a FALSE "Dev build created" comment (id
      # 210717333) while `gh release create` had just failed with 403; an
      # unconditional success claim must not survive a failed create.
      - name: Post commit comment
        if: always() && steps.check-release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          TAG="${{ steps.compute-tag.outputs.tag }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          if [[ "${{ steps.check-release.outputs.skip }}" == "true" ]]; then
            echo "Tag $TAG already exists — skipping comment"
            exit 0
          fi
          if [[ "${{ steps.create-release.outcome }}" == "success" ]]; then
            BODY="Dev build created: ${TAG} — https://github.com/${REPO}/releases/tag/${TAG}"
          else
            BODY="⚠️ Dev release create FAILED for ${TAG} after retries — no GitHub Release was created. Run: ${RUN_URL}"
          fi
          for attempt in 1 2 3; do
            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/commits/${HEAD_SHA}/comments" \
              -f body="$BODY"; then
              exit 0
            fi
            echo "Comment attempt $attempt failed. Sleeping $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          # Non-fatal: release outcome is already decided; a missing comment
          # must not redden the run (CI5 «Не делай»: comment never critical).
          echo "::warning::commit-comment failed after 3 retries (rate-limit?), release itself succeeded."
          exit 0

  notify-skipped:
    name: Notify on skipped dev-tag (CI was red)
    runs-on: ubuntu-latest
    # [GITHUB-P19] the inverse of create-dev-tag's gate: this job
    # runs ONLY when CI failed, leaving a visible breadcrumb on the
    # CI head SHA — otherwise a red CI shows up only as "skipped"
    # in the Actions list, indistinguishable from the idempotency
    # skip path. Without this, the maintainer does not see that
    # dev-tag pipeline has stopped producing releases.
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    permissions:
      contents: read
      pull-requests: write   # commit-comments need this scope
    timeout-minutes: 3
    steps:
      - name: Post commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ⚠️ **Dev-tag pipeline skipped**: CI conclusion was \`${CI_CONCLUSION}\`
          (not \`success\`). The \`vX.Y.Z-dev.N\` pre-release was NOT created
          for this commit.

          - CI run: https://github.com/${REPO}/actions/runs/${CI_RUN_ID}
          - Once CI is green again, the next \`workflow_run\` event will
            resume creating dev-tags automatically.

          Investigate the failing CI job above. Common causes:
          - dependabot major bump (secp256k1 0.29→0.33, toml 0.5→1.x —
            see [GITHUB-P16] ignore rules);
          - cargo fmt drift (run \`cargo fmt --all\` locally);
          - clippy::correctness regression (run
            \`cargo clippy --workspace --all-targets -- -D clippy::correctness\`).
          EOF
          )
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/commits/${HEAD_SHA}/comments" \
            -f body="$body"
