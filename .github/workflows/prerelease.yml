name: Pre-release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-dev-tag:
    name: Create dev tag
    runs-on: ubuntu-latest
    concurrency:
      group: prerelease-${{ github.event.workflow_run.id || github.run_id }}
      cancel-in-progress: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compute next dev tag
        id: compute-tag
        run: |
          # Extract version from Cargo.toml
          VERSION=$(grep '^version = ' Cargo.toml | cut -d '"' -f2)
          # Extract latest dev tag for this version
          LATEST_DEV_TAG=$(git ls-remote --tags origin "v${VERSION}-dev.*" | cut -f2 | sort -V | tail -1 || echo "")
          if [[ -n "$LATEST_DEV_TAG" ]]; then
            # Extract number from existing dev tag
            CURRENT_NUM=$(echo "$LATEST_DEV_TAG" | grep -o '[0-9]*$')
            NEXT_NUM=$((CURRENT_NUM + 1))
          else
            NEXT_NUM=1
          fi
          TAG="v${VERSION}-dev.${NEXT_NUM}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating dev tag: $TAG"

      - name: Check if release already exists
        id: check-release
        run: |
          if gh release view "${{ steps.compute-tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.compute-tag.outputs.tag }} already exists — skipping creation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build artifacts
        if: steps.check-release.outputs.skip != 'true'
        run: |
          # Build for Linux x86_64 (primary platform)
          cargo build --release
          cp target/release/strangecoin strangecoin-linux-x86_64
          shasum -a 256 strangecoin-linux-x86_64 > strangecoin-linux-x86_64.sha256

      - name: Create and push dev release
        if: steps.check-release.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.compute-tag.outputs.tag }}" \
            --target master \
            --prerelease \
            --title "${{ steps.compute-tag.outputs.tag }}" \
            --notes "Automated dev build, not for production" \
            --generate-notes \
            strangecoin-linux-x86_64 strangecoin-linux-x86_64.sha256

      - name: Ping Discord
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { tag } = context;
            if (steps.check-release.outputs.skip == 'true') {
              console.log(`Dev tag ${tag} already exists - skipping Discord notification`);
              return;
            }
            
            const octokit = github.getOctokit(process.env.GITHUB_TOKEN);
            await octokit.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 New dev build created: ${tag}\n\n${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`
            });

      - name: Update stargazer history
        if: always()
        run: |
          # Update stargazer count in README (same as release.yml)
          curl -s "https://api.github.com/repos/${{ github.repository }}" | \
            jq '.stargazers_count' > stargazers.txt
          if [ -f stargazers.txt ] && [ -s stargazers.txt ]; then
            STARS=$(cat stargazers.txt)
            if grep -q '⭐' README.md; then
              sed -i "s/⭐ [0-9]*/⭐ $STARS/" README.md
            else
              echo "⭐ $STARS stars" >> README.md
            fi
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add README.md
            git commit -m "Update stargazer count to $STARS" || true
            git push
          fi