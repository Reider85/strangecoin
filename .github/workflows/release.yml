name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # env: does not shell-expand $GITHUB_WORKSPACE — expression context is required,
  # otherwise --remap-path-prefix is a silent no-op.
  RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=."

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: strangecoin-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: strangecoin-linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: strangecoin-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: strangecoin-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: strangecoin-windows-x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: strangecoin-windows-aarch64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install cross-compilation tools (Windows aarch64)
        if: matrix.cross && runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          echo "Installing LLVM/Clang for aarch64 cross-compilation..."
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/strangecoin ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/strangecoin.exe" "${{ matrix.artifact }}.exe"

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}.exe").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.exe" | Out-File -Encoding ascii "${{ matrix.artifact }}.exe.sha256"

      - name: Upload artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.exe.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Collect hash for this artifact
        id: hash
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            sha256sum "${{ matrix.artifact }}.exe" > hash.txt
          else
            sha256sum "${{ matrix.artifact }}" > hash.txt
          fi
          echo "hash=$(cat hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksum
          path: hash.txt
          retention-days: 5

  aggregate-hashes:
    name: Aggregate checksums
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.aggregate.outputs.hashes }}
    steps:
      - name: Download all checksum files
        uses: actions/download-artifact@v4
        with:
          pattern: "*-checksum"
          path: checksums
          # merge-multiple would flatten all artifacts into one directory and
          # overwrite identically-named hash.txt files (only 1 of 6 would survive).

      - name: Aggregate hashes
        id: aggregate
        run: |
          set -euo pipefail
          cat checksums/*/hash.txt > hashes.txt
          test "$(wc -l < hashes.txt)" -eq 6
          # base64-subjects input must decode to sha256sum output (SLSA generator docs).
          echo "hashes=$(base64 -w0 hashes.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA Provenance
    needs: aggregate-hashes
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.aggregate-hashes.outputs.hashes }}"
      upload-assets: true
      draft-release: false

  sign:
    name: Sign artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign each artifact
        run: |
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              case "$file" in
                *.sha256|*/hash.txt) continue ;;
              esac
              echo "Signing $file..."
              cosign sign-blob \
                --yes \
                --output-signature "${file}.cosign" \
                --output-certificate "${file}.cosign.pem" \
                "$file"
            done
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: cosign-signatures
          path: artifacts/**/*.cosign*
          retention-days: 5

  release:
    name: Create Release
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download checksum files
        uses: actions/download-artifact@v4
        with:
          pattern: "*-checksum"
          path: checksums

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'hash.txt' -exec cp {} release/ \;
          # Combined SHA256SUMS.txt (one line per artifact, sha256sum format)
          cat checksums/*/hash.txt > release/SHA256SUMS.txt
          sort -k2 -o release/SHA256SUMS.txt release/SHA256SUMS.txt
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
