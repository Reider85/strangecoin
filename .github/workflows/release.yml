name: Release

# [GITHUB-P06] Hybrid runners: `build` reads the repo variable RUNS_ON (JSON
# label array). Unset -> the 6-cell GitHub-hosted matrix runs exactly as
# before. Set (free minutes exhausted) -> the build matrix collapses to the
# single windows-x86_64 cell (dynamic `matrix.include`; the `matrix` context
# is unavailable in jobs.<job_id>.if) — every other cell is simply not
# offered to the local runner (macOS / Linux hosts cannot be cross-built
# from the Windows runner), so a fallback release carries the Windows x86_64
# artifact only. The SLSA `provenance`
# job is a called external workflow pinned to ubuntu-latest — it cannot be
# retargeted, so it is skipped while RUNS_ON is set (documented degradation:
# no attestation on fallback releases). `aggregate-hashes`/`sign`/`release`
# are portable shell jobs -> they follow RUNS_ON too. See
# .github/SELF_HOSTED_RUNNERS.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # env: does not shell-expand $GITHUB_WORKSPACE — expression context is required,
  # otherwise --remap-path-prefix is a silent no-op.
  RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=."

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.target }})
    # [GITHUB-P06] unset -> matrix.os (GitHub-hosted); set -> self-hosted labels.
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON(format('["{0}"]', matrix.os)) }}
    # [GITHUB-P1] Dev tags (vX.Y.Z-dev.N, minted by prerelease.yml) must not
    # trigger the full 6-platform release. GitHub Actions makes `tags` and
    # `tags-ignore` mutually exclusive, so the exclusion lives here instead
    # of the `on.push.tags` filter. Every downstream job (aggregate-hashes /
    # provenance / sign / release) `needs` this one, so gating it gates the
    # whole workflow; real vX.Y.Z tags are unaffected.
    # [GITHUB-P06] NOTE: the RUNS_ON cell filter CANNOT live here — the
    # `matrix` context is not available in jobs.<job_id>.if (GitHub/actionlint:
    # "context matrix is not allowed here"; a job-level `matrix.local` guard
    # made the whole file invalid -> phantom 0-job runs). It lives in the
    # dynamic `matrix.include` below instead (vars is allowed in strategy).
    if: ${{ !contains(github.ref_name, '-dev.') }}
    strategy:
      fail-fast: false
      matrix:
        # [GITHUB-P06] dynamic cell filter: RUNS_ON unset -> all 6 cells on
        # GitHub-hosted; RUNS_ON set -> only the windows-x86_64 cell (the
        # local Windows runner cannot build linux/macos targets), so a
        # fallback release ships the Windows artifact only.
        include: ${{ vars.RUNS_ON && fromJSON('[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","target_local":"x86_64-pc-windows-gnu","artifact":"strangecoin-windows-x86_64"}]') || fromJSON('[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"strangecoin-linux-x86_64"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","artifact":"strangecoin-linux-aarch64","cross":true},{"os":"macos-latest","target":"x86_64-apple-darwin","artifact":"strangecoin-macos-x86_64"},{"os":"macos-latest","target":"aarch64-apple-darwin","artifact":"strangecoin-macos-aarch64"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","target_local":"x86_64-pc-windows-gnu","artifact":"strangecoin-windows-x86_64"},{"os":"windows-latest","target":"aarch64-pc-windows-msvc","artifact":"strangecoin-windows-aarch64","cross":true,"allow_failure":true}]') }}

    steps:
      - uses: actions/checkout@v4

      # [GITHUB-P06] resolve the effective target once: GitHub-hosted keeps
      # matrix.target; the local runner builds the host gnu triple instead
      # of the msvc cross cell (no MSVC toolchain on the dev machine).
      - name: Resolve effective target
        id: tgt
        shell: bash
        run: |
          if [ -n "${RUNS_ON:-}" ]; then
            eff="${{ matrix.target_local || matrix.target }}"
          else
            eff="${{ matrix.target }}"
          fi
          echo "target=${eff}" >> "$GITHUB_OUTPUT"
        env:
          RUNS_ON: ${{ vars.RUNS_ON }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # [GITHUB-P06] local runner pins the gnu-flavor toolchain (matches
          # the dev machine's rustup default; the msvc flavor would need MSVC).
          toolchain: ${{ vars.RUNS_ON && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
          targets: ${{ steps.tgt.outputs.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.tgt.outputs.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install cross-compilation tools (Windows aarch64)
        if: matrix.cross && runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          echo "Installing LLVM/Clang for aarch64 cross-compilation..."
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ steps.tgt.outputs.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ steps.tgt.outputs.target }}/release/strangecoin ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ steps.tgt.outputs.target }}/release/strangecoin.exe" "${{ matrix.artifact }}.exe"

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}.exe").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.exe" | Out-File -Encoding ascii "${{ matrix.artifact }}.exe.sha256"

      - name: Upload artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.exe.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Collect hash for this artifact
        id: hash
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            sha256sum "${{ matrix.artifact }}.exe" > hash.txt
          else
            sha256sum "${{ matrix.artifact }}" > hash.txt
          fi
          echo "hash=$(cat hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksum
          path: hash.txt
          retention-days: 5

  aggregate-hashes:
    name: Aggregate checksums
    needs: build
    # [GITHUB-P06] hybrid runner (see header).
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    outputs:
      hashes: ${{ steps.aggregate.outputs.hashes }}
    steps:
      - name: Download all checksum files
        uses: actions/download-artifact@v4
        with:
          pattern: "*-checksum"
          path: checksums
          # merge-multiple would flatten all artifacts into one directory and
          # overwrite identically-named hash.txt files (only 1 of 6 would survive).

      - name: Aggregate hashes
        id: aggregate
        # [GITHUB-P06] shell: bash (local runner default is pwsh); the hash
        # count is derived from the checksum files instead of the literal 6 —
        # a fallback run only produces the local cells' artifacts.
        shell: bash
        run: |
          set -euo pipefail
          cat checksums/*/hash.txt > hashes.txt
          expected=$(find checksums -name hash.txt | wc -l)
          test "$(wc -l < hashes.txt)" -eq "$expected"
          test "$expected" -ge 1
          # base64-subjects input must decode to sha256sum output (SLSA generator docs).
          echo "hashes=$(base64 -w0 hashes.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA Provenance
    needs: aggregate-hashes
    # [GITHUB-P06] the SLSA generator is an external reusable workflow pinned
    # to its own ubuntu-latest runners — it cannot follow RUNS_ON, so while
    # the local fallback is active this job is skipped (fallback releases
    # ship without attestation; documented in .github/SELF_HOSTED_RUNNERS.md).
    if: ${{ !vars.RUNS_ON }}
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.aggregate-hashes.outputs.hashes }}"
      upload-assets: true
      draft-release: false

  sign:
    name: Sign artifacts
    needs: build
    # [GITHUB-P06] hybrid runner (see header).
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      # [GITHUB-P06] shell: bash — the local Windows runner defaults to pwsh,
      # which cannot run this for-loop (cosign.exe resolves via PATHEXT).
      - name: Sign each artifact
        shell: bash
        run: |
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              case "$file" in
                *.sha256|*/hash.txt) continue ;;
              esac
              echo "Signing $file..."
              cosign sign-blob \
                --yes \
                --output-signature "${file}.cosign" \
                --output-certificate "${file}.cosign.pem" \
                "$file"
            done
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: cosign-signatures
          path: artifacts/**/*.cosign*
          retention-days: 5

  release:
    name: Create Release
    needs: [build, sign]
    # [GITHUB-P06] hybrid runner (see header).
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download checksum files
        uses: actions/download-artifact@v4
        with:
          pattern: "*-checksum"
          path: checksums

      # [GITHUB-P06] shell: bash (pwsh on the local runner cannot run find/cp).
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'hash.txt' -exec cp {} release/ \;
          # Combined SHA256SUMS.txt (one line per artifact, sha256sum format)
          cat checksums/*/hash.txt > release/SHA256SUMS.txt
          sort -k2 -o release/SHA256SUMS.txt release/SHA256SUMS.txt
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
