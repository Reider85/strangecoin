# Strangecoin Funding

Strangecoin is an open-source project developed and maintained by the community. If you find this project useful, please consider supporting its development.

## Ways to Contribute

- **Code**: Submit pull requests to fix bugs, add features, or improve documentation
- **Issues**: Report bugs, request features, or help with triaging
- **Discussions**: Join conversations in [Discussions](https://github.com/Reider85/strangecoin/discussions)
- **Security**: Report security vulnerabilities privately

