# [GITHUB-P3] Dependabot: weekly cargo + github-actions update PRs
# (analytics/GITHUB.md P3 item 4).
#
# PIN POLICY (AGENTS.md §Stage 2/3 Pin Policy): consensus / data-layout /
# crypto dependencies are pinned with `=` and may only be bumped via SCIP +
# activation height after mainnet freeze. Dependabot PRs against those crates
# are proposals only — never auto-merge; manual review with the pin policy
# applies (labels: [dependencies]).
#
# [GITHUB-P16] Ignore rules below enforce the crypto/consensus policy at the
# Dependabot level: minor/major bumps of secp256k1/rand/aes-gcm/pbkdf2 (and
# major of rand_core/blake3/wasmi/wasmtime) never open a PR — those bumps are
# SCIP-gated (AGENTS.md §Stage 3 Pin Policy). Patch bumps within the current
# minor line stay enabled (semver-compatible, incl. RUSTSEC fixes).
# [GITHUB-P16] Grouped updates collapse the remaining weekly bumps into one
# PR per ecosystem instead of the 12 blind-merge commits of 2026-11-16.
#
# Deviation from spec: `/fuzz` is a separate Cargo workspace
# (fuzz/Cargo.toml carries its own `[workspace]`) and is not covered by the
# root `cargo` entry — the spec asks for exactly two ecosystems, so a
# `directory: "/fuzz"` entry can be added later if desired.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "secp256k1"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "secp256k1-sys"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "rand_core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "aes-gcm"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "pbkdf2"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "blake3"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "wasmi"
        update-types:
          - "version-update:semver-major"
    groups:
      cargo-minor:
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # [GITHUB-P21] release-pipeline artifact actions: major bumps of
    # actions/upload-artifact + actions/download-artifact are SCIP-style
    # deliberate bumps only — the blind-merged 4→7 / 4→8 majors (CI4 root
    # cause, PRs #1/#2) are exactly what this blocks. Patch/minor within the
    # current major line stay enabled and flow through the grouped PR below.
    # Keep both sides on their Latest lines (upload v7 / download v8 —
    # companion majors, see release.yml header).
    ignore:
      - dependency-name: "actions/upload-artifact"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "actions/download-artifact"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions-minor:
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
