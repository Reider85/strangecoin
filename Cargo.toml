[workspace]
members = [".", "crates/strangecoin-core"]
resolver = "2"

[package]
name = "strangecoin"
version = "1.0.0"
edition = "2021"

[dependencies]
strangecoin-core = { path = "crates/strangecoin-core" }
ctrlc = "3.4"
rusty-leveldb = "4.0.0"
uuid = { version = "1.17.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10"
rand = "0.8"
eframe = { version = "0.22", optional = true }
# eframe 0.22 uses winapi without declaring features; winit 0.28 (its transitive
# dep) moved to windows-sys, so nothing in the graph enables winapi features and
# eframe fails to compile with "no `winuser` in `um`". Declare them explicitly.
winapi = { version = "0.3", optional = true, features = [
    "winuser",
    "commctrl",
    "commoncontrols",
    "shellapi",
    "winbase",
    "winsock2",
    "wincon",
    "winerror",
    "wingdi",
    "winspool",
    "winnt",
    "minwindef",
    "windef",
    "std",
    "stringapiset",
    "winver",
    "objbase",
    "objidlbase",
    "libloaderapi",
    "ntstatus",
    "synchapi",
    "processthreadsapi",
] }
toml = "0.5"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
rand_core = "0.6.4"
base64 = "0.22.1"
aes-gcm = "0.10"
secp256k1 = { version = "0.29", features = ["rand", "serde", "global-context", "recovery"] }
thiserror = "1"
hex = "0.4"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "signal",
] }

[features]
default = []
gui = ["dep:eframe", "dep:winapi"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1"
