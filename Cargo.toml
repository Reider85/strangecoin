[package]
name = "strangecoin"
version = "0.8.6"
edition = "2021"

[dependencies]
ctrlc = "3.4"
rusty-leveldb = "4.0.0"
uuid = { version = "1.17.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10"
rand = "0.8"
eframe = "0.22"
toml = "0.5"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
rand_core = "0.6.4"
base64 = "0.22.1"
aes-gcm = "0.10"
secp256k1 = { version = "0.29", features = ["rand", "serde", "global-context", "recovery"] }
thiserror = "1"
hex = "0.4"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1"