[workspace]
members = [".", "crates/strangecoin-core", "crates/strangecoin-vm-wasm", "crates/strangecoin-net", "crates/strangecoin-storage"]
resolver = "2"

[package]
name = "strangecoin"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
strangecoin-core = { path = "crates/strangecoin-core" }
strangecoin-vm-wasm = { path = "crates/strangecoin-vm-wasm", optional = true }
# Stage 2 network crate (S2-P05); populated by S2-P06..S2-P20.
strangecoin-net = { path = "crates/strangecoin-net", version = "0.1.0", optional = true }
# Stage 3 storage crate (S3-P04); monolith migrates onto it in S3-P07.
# Default features (rocksdb, default-on) link the pinned C++ backend.
strangecoin-storage = { path = "crates/strangecoin-storage" }
ctrlc = "3.4"
# S3-P08: transitional — only the read-only LevelDB reader of the one-shot
# LevelDB -> RocksDB migration (`src/storage/migrations.rs`) still needs this
# crate; the storage engine itself is RocksDB since S3-P07. Optional behind
# the default-on `legacy-migrate` feature so `--no-default-features` builds
# (light/headless direction) carry no LevelDB code at all. Full removal of
# the crate (with the reader) is a Stage 4+ cleanup — see the S3-P08 commit
# deviation note (КГ "cargo tree -i rusty-leveldb" is non-empty in default
# features: exactly one runtime edge, the migration reader).
# Pinned exact per Stage 3 Pin Policy (AGENTS.md): caret "4.0.0" since
# Stage 0, fixed at =4.0.0 in S3-P08 — a caret bump changing legacy read
# semantics would silently corrupt the one-shot migration.
rusty-leveldb = { version = "=4.0.0", optional = true }
uuid = { version = "1.17.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
rand = "0.8"
eframe = { version = "0.34", optional = true }
# eframe 0.22 uses winapi without declaring features; winit 0.28 (its transitive
# dep) moved to windows-sys, so nothing in the graph enables winapi features and
# eframe fails to compile with "no `winuser` in `um`". Declare them explicitly.
winapi = { version = "0.3", optional = true, features = [
    "winuser",
    "commctrl",
    "commoncontrols",
    "shellapi",
    "winbase",
    "winsock2",
    "wincon",
    "winerror",
    "wingdi",
    "winspool",
    "winnt",
    "minwindef",
    "windef",
    "std",
    "stringapiset",
    "winver",
    "objbase",
    "objidlbase",
    "libloaderapi",
    "ntstatus",
    "synchapi",
    "processthreadsapi",
] }
toml = "0.5"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
rand_core = "0.6.4"
base64 = "0.22.1"
aes-gcm = "0.10"
secp256k1 = { version = "0.29", features = ["rand", "serde", "global-context", "recovery"] }
thiserror = "1"
hex = "0.4"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "signal",
    "io-util",
] }

[features]
# net is default-on (Stage 2, S2-P05): the node participates in P2P by
# default; --no-default-features light-node builds are a Stage 4+ concern.
# vm-wasm is default-on (regtest/devnet builds).
# gui is default-on per S2-P05 spec (operator desktop client; headless via
# --no-default-features + selective re-enable).
# legacy-migrate is default-on (S3-P08): the LevelDB -> RocksDB one-shot
# auto-migration must read the legacy `<exe_dir>/blockchain_db_{port}`
# directory in production builds (ADR-0008 "run automatically on first
# startup"); --no-default-features builds drop it with everything else.
default = ["net", "vm-wasm", "gui", "legacy-migrate"]
net = ["dep:strangecoin-net"]
vm-wasm = ["dep:strangecoin-vm-wasm"]
gui = ["dep:eframe", "dep:winapi"]
legacy-migrate = ["dep:rusty-leveldb"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1"

# Vendored minisketch-rs 0.1.9 (S3-P04, 2026-10-30): the registry crate's
# build-dep bindgen 0.49 (clang-sys 0.28, links = "clang") conflicts with
# librocksdb-sys's bindgen 0.72 (clang-sys 1.9.1, same links key) — cargo
# admits one links provider, so the registry crate cannot coexist with the
# rocksdb 0.25.0 storage backend in one lockfile. The vendored copy is
# upstream-identical except the bindgen line + two allowlist_* renames (see
# vendor/minisketch-rs/Cargo.toml provenance note); it is default-OFF
# (strangecoin-net feature `minisketch`, SCIP-gated, ADR-0021) and never
# builds unless that feature is enabled. See `vendor/README.md`.
[patch.crates-io]
minisketch-rs = { path = "vendor/minisketch-rs" }
